name: Release client

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test "$version" = "${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk "OmniConvert-${{ needs.metadata.outputs.version }}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OmniConvert-${{ needs.metadata.outputs.version }}-android-arm64.apk

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "OmniConvert-${{ needs.metadata.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OmniConvert-${{ needs.metadata.outputs.version }}-windows-x64.zip

  linux:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build linux --release
      - run: tar -czf "OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.tar.gz

  macos:
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build macos --release
      - run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/OmniConvert.app "OmniConvert-${{ needs.metadata.outputs.version }}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OmniConvert-${{ needs.metadata.outputs.version }}-macos-universal.zip

  release:
    needs: [metadata, android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Build release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"
          previous=$(git describe --tags --abbrev=0 "$current^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$current"
          else
            range="$current"
          fi
          {
            echo "## Changelog"
            git log --pretty=format:'- %s (%h)' "$range"
            printf '\n\n## Contributors\n\n'
            if [ -n "$previous" ]; then
              contributors=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$current" --paginate --jq '.commits[].author.login // empty' | sort -fu)
            else
              contributors=$(git log --format='%aE' "$range" | sort -fu | sed -E 's/.*dependabot.*/dependabot[bot]/; s/.*/sinxy-sai/' | sort -fu)
            fi
            printf '%s\n' "$contributors" > contributors.txt
            python -m pip install --disable-pip-version-check --quiet Pillow
            python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          from PIL import Image, ImageDraw

          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          for login in Path("contributors.txt").read_text().splitlines():
              login = login.strip()
              if not login:
                  continue
              request = Request(
                  f"https://github.com/{login}.png?size=256",
                  headers={"User-Agent": "OmniConvert-release-bot"},
              )
              with urlopen(request, timeout=30) as response:
                  source = Image.open(response).convert("RGBA")
              size = min(source.size)
              left = (source.width - size) // 2
              top = (source.height - size) // 2
              avatar = source.crop((left, top, left + size, top + size)).resize((72, 72), Image.Resampling.LANCZOS)
              mask = Image.new("L", (72, 72), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, 71, 71), fill=255)
              avatar.putalpha(mask)
              avatar.save(assets / f"contributor-{login}.png", "PNG", optimize=True)
          PY
            while read -r login; do
              [ -n "$login" ] || continue
              printf '<a href="https://github.com/%s"><img src="https://github.com/%s/releases/download/%s/contributor-%s.png" width="72" height="72" alt="%s" /></a> ' "$login" "$GITHUB_REPOSITORY" "$current" "$login" "$login"
            done <<< "$contributors"
            printf '\n'
            printf '\n'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: assets/*
