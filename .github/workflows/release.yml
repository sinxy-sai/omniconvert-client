name: Release client

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test "$version" = "${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OMNICONVERT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          OMNICONVERT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMNICONVERT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$OMNICONVERT_ANDROID_STORE_PASSWORD"
          test -n "$OMNICONVERT_ANDROID_KEY_ALIAS"
          test -n "$OMNICONVERT_ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omniconvert-release.jks"
          echo "OMNICONVERT_ANDROID_KEYSTORE=$RUNNER_TEMP/omniconvert-release.jks" >> "$GITHUB_ENV"
          echo "OMNICONVERT_ANDROID_STORE_PASSWORD=$OMNICONVERT_ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OMNICONVERT_ANDROID_KEY_ALIAS=$OMNICONVERT_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OMNICONVERT_ANDROID_KEY_PASSWORD=$OMNICONVERT_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "OmniConvert-${{ needs.metadata.outputs.version }}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OmniConvert-${{ needs.metadata.outputs.version }}-android-arm64.apk

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build Rust native library
        run: cargo build --manifest-path rust/Cargo.toml --release
      - run: flutter build windows --release
      - name: Bundle Rust native library
        shell: pwsh
        run: |
          $source = 'rust/target/release/omniconvert_core.dll'
          $destination = 'build/windows/x64/runner/Release/omniconvert_core.dll'
          if (-not (Test-Path $source)) { throw "Rust native library was not built: $source" }
          Copy-Item -Force $source $destination
      - shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Package Windows installer and portable archive
        shell: pwsh
        run: .\ops\windows\package.ps1 -Version "${{ needs.metadata.outputs.version }}" -OutputDir .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            OmniConvert-${{ needs.metadata.outputs.version }}-windows-x64.zip
            OmniConvert-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe

  linux:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg
      - name: Install appimagetool
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          echo "APPIMAGETOOL=/tmp/appimagetool.AppImage" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package Linux distributions
        shell: bash
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash ops/linux/package-appimage.sh "${{ needs.metadata.outputs.version }}" build/linux/x64/release/bundle "OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.AppImage"
          bash ops/linux/package-deb.sh "${{ needs.metadata.outputs.version }}" build/linux/x64/release/bundle "OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.deb"
          tar -czf "OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.AppImage
            OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.deb
            OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64.tar.gz

  macos:
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Package macOS DMG and portable ZIP
        shell: bash
        run: |
          archs=$(lipo -archs build/macos/Build/Products/Release/OmniConvert.app/Contents/MacOS/OmniConvert)
          if [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]; then arch_label=universal;
          elif [[ "$archs" == *arm64* ]]; then arch_label=arm64;
          else arch_label=x64; fi
          bash ops/macos/package-dmg.sh "${{ needs.metadata.outputs.version }}" build/macos/Build/Products/Release/OmniConvert.app "OmniConvert-${{ needs.metadata.outputs.version }}-macos-${arch_label}.dmg"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/OmniConvert.app "OmniConvert-${{ needs.metadata.outputs.version }}-macos-${arch_label}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            OmniConvert-${{ needs.metadata.outputs.version }}-macos-*.dmg
            OmniConvert-${{ needs.metadata.outputs.version }}-macos-*.zip

  release:
    needs: [metadata, android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Build release notes with GitHub generated contributors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"
          previous=$(git describe --tags --abbrev=0 "$current^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$current"
          else
            range="$current"
          fi
          if [ -n "$previous" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$current" \
              -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$previous" \
              --jq .body > generated-release-notes.md
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$current" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body > generated-release-notes.md
          fi
          {
            echo "## Full Changelog"
            git log --pretty=format:'- %s (%h)' "$range"
            printf '\n\n'
            cat generated-release-notes.md
          } > release-notes.md
      - name: Generate release checksums
        shell: bash
        run: cd assets && sha256sum OmniConvert-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: assets/*
      - name: Notify website repository
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_REPO_TOKEN is not configured; website rebuild must be triggered manually."
            exit 0
          fi
          gh api repos/sinxy-sai/omniconvert-site/dispatches \
            --method POST \
            -f event_type=client-release \
            -f client_payload[client_ref]="$GITHUB_REF_NAME"
