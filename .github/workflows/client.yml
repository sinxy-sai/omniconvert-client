name: Client platforms

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - shell: pwsh
        run: ./tool/verify_platforms.ps1 -Target windows
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-windows-x64
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - run: bash tool/verify_platforms.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-linux-x64
          path: build/linux/x64/debug/bundle/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build Android APK with dependency retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bash tool/verify_platforms.sh android --skip-checks; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android build attempt $attempt failed; retrying after dependency caches settle..."
              sleep 15
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-android-universal-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  web:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/verify_platforms.sh web --skip-checks
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-web-browser
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - run: bash tool/verify_platforms.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-macos-universal
          path: build/macos/Build/Products/Debug/*.app/
          if-no-files-found: error
          retention-days: 7

  ios-check:
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash tool/verify_platforms.sh ios-check --skip-checks
      - uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-${{ needs.metadata.outputs.version }}-ios-arm64-unsigned
          path: build/ios/iphoneos/Runner.app/
          if-no-files-found: error
          retention-days: 7
