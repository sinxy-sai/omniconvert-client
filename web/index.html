<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    base href 由 `flutter build web --base-href` 注入；
    OmniConvert 为纯静态 Web App，不依赖任何后端渲染或外部字体 CDN。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniConvert — 本地优先的文件工具箱：格式转换、图片压缩，文件默认在本机处理。">
  <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OmniConvert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmniConvert · 文件处理，简单一点</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F7F9FC;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B1220; }
    }
    /* Flutter 启动前的品牌过渡层：被 flutter-view 覆盖，加载完成后自动移除。 */
    #oc-boot {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #475569;
      pointer-events: none;
    }
    /* 品牌标记：内联 SVG（渐变圆角 plate + 白色 O/C 环与箭头） */
    #oc-boot .oc-mark {
      width: 44px;
      height: 44px;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(11, 18, 32, .04))
              drop-shadow(0 12px 32px rgba(11, 18, 32, .10));
    }
    #oc-boot .oc-label {
      font-size: 13px;
      letter-spacing: .02em;
      opacity: .85;
    }
    @media (prefers-color-scheme: dark) {
      #oc-boot { color: #94A3B8; }
    }
  </style>
</head>
<body>
  <div id="oc-boot" aria-hidden="true">
    <!-- 与 tool/generate_app_icons.py、站点品牌标记同源的几何：32x32 网格，
         外环 r=11.5/w=3.15，内环 r=5.6/w=2.7，12 点方向切线箭头。 -->
    <svg class="oc-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniConvert">
      <defs>
        <linearGradient id="oc-boot-plate" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4F46E5"/>
          <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#oc-boot-plate)"/>
      <g transform="translate(4.8 4.8) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
        <circle cx="16" cy="16" r="5.6" stroke-width="2.7"/>
        <path d="M 27.16 13.22 A 11.5 11.5 0 1 1 16 4.5" stroke-width="3.15"/>
        <polygon points="22.8,4.5 15.6,7.1 15.6,1.9" fill="#FFFFFF" stroke="#FFFFFF"
                 stroke-width="1.4" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="oc-label">OmniConvert · 正在加载…</div>
  </div>

  <!--
    可自定义 flutter_bootstrap.js 以提供加载反馈或初始化配置。
    参见 https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var boot = document.getElementById('oc-boot');
      var done = false;
      function clearBoot() {
        if (done) return;
        var view = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
        if (!view) return;
        done = true;
        if (boot) {
          boot.style.transition = 'opacity 160ms ease';
          boot.style.opacity = '0';
          setTimeout(function () { boot.remove(); }, 200);
        }
        if (observer) observer.disconnect();
      }
      var observer = null;
      if (window.MutationObserver) {
        observer = new MutationObserver(clearBoot);
        observer.observe(document.body, { childList: true, subtree: true });
      }
      window.addEventListener('load', function () {
        setTimeout(clearBoot, 800);
      });
      setTimeout(clearBoot, 20000);
    })();
  </script>
</body>
</html>
