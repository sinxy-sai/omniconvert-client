<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OmniConvert 跨平台文件与公式工具正在筹备中。">
  <title>OmniConvert · 即将上线</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #f7f9fc; color: #142033; }
    main { width: min(760px, calc(100% - 40px)); margin: auto; padding: 64px 0; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .01em; color: #1649a1; }
    .mark::before { content: "∑"; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #1649a1; color: white; font-size: 22px; }
    h1 { margin: 32px 0 14px; font-size: clamp(36px, 7vw, 64px); line-height: 1.12; letter-spacing: -.04em; }
    p { max-width: 620px; margin: 0; color: #4b5a70; font-size: 18px; line-height: 1.75; }
    .pill { display: inline-block; margin-top: 28px; padding: 9px 14px; border: 1px solid #d4e0f2; border-radius: 999px; color: #1649a1; background: #ebf2ff; font-size: 14px; }
    footer { padding: 24px 20px 28px; border-top: 1px solid #e3e9f2; text-align: center; color: #5b687b; font-size: 13px; line-height: 1.8; }
    footer .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: #1649a1; text-decoration: underline; }
    footer img { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">OmniConvert</div>
    <h1>工具正在准备中</h1>
    <p>我们正在构建一个面向学习与研究的跨平台文件与公式工具。完整官网、客户端下载和 Web 工具将在准备好后于此开放。</p>
    <span class="pill">本地优先 · 跨平台 · 开源客户端</span>
  </main>
  <footer>
    <div class="links">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">粤ICP备2026106130号-1</a>
      <a href="https://beian.mps.gov.cn/#/query/webSearch?code=44172302000150" target="_blank" rel="noreferrer"><img alt="" src="/beian-icon.png">粤公网安备44172302000150号</a>
    </div>
  </footer>
</body>
</html>
